<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Indoor Wall -->
  <rect width="800" height="380" fill="url(#wallGrad)"/>
  
  <!-- Hardwood Floor -->
  <rect y="380" width="800" height="220" fill="url(#woodFloor)"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#854d0e" stroke-width="2"/>
  <line x1="0" y1="490" x2="800" y2="490" stroke="#854d0e" stroke-width="2"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#854d0e" stroke-width="2"/>

  <!-- Wall picture / artwork -->
  <rect x="300" y="80" width="200" height="130" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="8"/>
  <circle cx="360" cy="140" r="22" fill="#f59e0b"/>
  <path d="M 320 180 L 370 130 L 420 180 Z" fill="#10b981"/>
  <path d="M 400 180 L 440 145 L 480 180 Z" fill="#059669"/>

  <!-- Living Room Sofa -->
  <!-- Sofa Backrest -->
  <rect x="180" y="240" width="440" height="130" rx="20" fill="url(#sofaGrad)"/>
  <!-- Sofa Cushions -->
  <rect x="200" y="320" width="200" height="110" rx="16" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="400" y="320" width="200" height="110" rx="16" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <!-- Sofa Armrests -->
  <rect x="150" y="290" width="60" height="130" rx="16" fill="#2563eb"/>
  <rect x="590" y="290" width="60" height="130" rx="16" fill="#2563eb"/>
  <!-- Sofa Wooden Legs -->
  <rect x="190" y="430" width="16" height="30" rx="4" fill="#451a03"/>
  <rect x="594" y="430" width="16" height="30" rx="4" fill="#451a03"/>

  <!-- Coffee Table in foreground -->
  <ellipse cx="400" cy="490" rx="150" ry="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="380" cy="485" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="380" cy="485" r="8" fill="#78350f"/>

  <!-- AI Vision Detection HUD Overlay -->
  <rect x="130" y="220" width="540" height="260" rx="12" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="130" y="175" width="460" height="38" rx="6" fill="#e11d48"/>
  <text x="145" y="200" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">❌ NON_INFRASTRUCTURE: INDOOR_FURNITURE [98.1%]</text>
  <text x="145" y="505" font-family="monospace" font-size="12" font-weight="bold" fill="#fecdd3">ZERO ROADWAY DEFECT SIGNATURES • REJECTED</text>
</svg>
